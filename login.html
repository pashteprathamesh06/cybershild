<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Log In — CyberShield AI</title>
<link rel="stylesheet" href="css/style.css" />
</head>
<body>

<nav class="navbar">
  <div class="navbar-inner">
    <a href="index.html" class="brand"><span class="brand-mark">CS</span> CyberShield AI</a>
    <div></div>
    <div class="nav-actions">
      <span class="text-muted" style="font-size:0.88rem;">New here?</span>
      <a href="register.html" class="btn btn-secondary btn-sm">Create Account</a>
    </div>
  </div>
</nav>

<div class="auth-shell">
  <div class="auth-card">
    <div class="card">
      <span class="eyebrow">Welcome back</span>
      <h2 style="margin-top:10px;">Log in to your account</h2>
      <p class="text-muted" style="margin-bottom:26px;">Access your dashboard, scan history, and threat reports.</p>

      <form id="login-form">
        <div class="field">
          <label for="email">Email address</label>
          <input type="email" id="email" required autocomplete="email" placeholder="you@example.com" />
        </div>
        <div class="field">
          <label for="password">Password</label>
          <input type="password" id="password" required autocomplete="current-password" placeholder="••••••••" />
        </div>
        <button type="submit" class="btn btn-primary btn-block" id="login-btn">
          <span id="login-btn-text">Log In</span>
        </button>
      </form>

      <div class="divider-or">or</div>
      <p class="text-center text-muted" style="font-size:0.88rem;">
        Don't have an account? <a href="register.html" style="color:var(--brand-strong);font-weight:600;">Sign up free</a>
      </p>
    </div>
  </div>
</div>

<script src="js/api.js"></script>
<script src="js/main.js"></script>
<script>
redirectIfLoggedIn();

document.getElementById('login-form').addEventListener('submit', async (e) => {
  e.preventDefault();
  const btn = document.getElementById('login-btn');
  const btnText = document.getElementById('login-btn-text');
  const email = document.getElementById('email').value.trim();
  const password = document.getElementById('password').value;

  btn.disabled = true;
  btnText.innerHTML = '<span class="spinner"></span>';

  try {
    const data = await CyberShieldAPI.post('/auth/login', { email, password });
    CyberShieldAPI.setSession(data.token, data.user);
      window.location.href = 'dashboard.html';
  } catch (err) {
    showToast(err.message || 'Login failed', 'error');
    btn.disabled = false;
    btnText.textContent = 'Log In';
  }
});
</script>
</body>
</html>
